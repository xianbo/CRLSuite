[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crlsim"
version = "0.1.0"
description = "Ray-tracing and wavefront simulation for compound refractive X-ray lenses"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "h5py>=3.6",
    "matplotlib>=3.5",
    "numpy>=1.21,<3",
    "scipy>=1.7",
    "xraylib>=4.1",
]

[project.scripts]
crlsuite = "crlsim.app:main"

[project.optional-dependencies]
dev = [
    "build>=0.10",
    "mypy>=1.0",
    "pytest>=7",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["crlsim*"]

[tool.setuptools.data-files]
"share/crlsuite/examples" = ["examples/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["h5py", "h5py.*", "matplotlib.*", "scipy.*", "xraylib"]
ignore_missing_imports = true
